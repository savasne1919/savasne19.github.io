<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタイリッシュなスポーツウェアブランド</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* 全体の背景色 */
            background-color: #172554; /* blue-950 */
            color: #ffffff;
        }
        /* スムーズスクロールを追加 */
        html {
            scroll-behavior: smooth;
        }
        /* Product card specific styles */
        .product-card-preview {
            /* 画像（カード）の背景：全体の背景色と同じにする */
            background-color: #172554;
            /* 背景と同化しないように枠線を追加 */
            border: 1px solid #1e40af; /* blue-800 */
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease-in-out;
        }
        .product-card-preview:hover {
            transform: translateY(-5px);
            border-color: #3b82f6; /* ホバー時に枠線を少し明るく */
        }
        /* Feature card specific styles */
        .feature-card {
            /* 画像（カード）の背景：全体の背景色と同じにする */
            background-color: #172554;
            /* 背景と同化しないように枠線を追加 */
            border: 1px solid #1e40af; /* blue-800 */
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            padding: 1.5rem;
            text-align: left;
            transition: transform 0.3s ease-in-out;
        }
        .feature-card:hover {
            transform: translateY(-5px);
            border-color: #3b82f6; /* ホバー時に枠線を少し明るく */
        }
        .feature-icon {
            color: #f97316;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            width: 48px;
            height: 48px;
        }
        .feature-image-icon {
            width: 1.5rem;
            height: 1.5rem;
            margin: 0 auto 1rem auto;
        }
        .logo-svg {
            height: 2rem;
            width: auto;
        }
        /* Active navigation link style */
        .active-nav-link {
            color: #ffffff;
            font-weight: 600;
            text-decoration: underline;
        }
        .gallery-background {
            background-image: url('5A4F8081-302C-4E69-ACF4-77E14A8848DF.JPG'), url('7289983B-F9F1-40FF-8C10-C4E86030D5B4 2.JPG');
            background-size: 50% auto, 50% auto;
            background-repeat: no-repeat, no-repeat;
            background-position: left top, right center;
        }
    </style>
</head>
